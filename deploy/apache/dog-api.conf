<VirtualHost *:80>
    ServerName api.yourdomain.com
    ServerAlias www.api.yourdomain.com

    # Proxy all requests to the .NET API on port 5100
    ProxyPreserveHost On
    ProxyPass / http://localhost:5100/
    ProxyPassReverse / http://localhost:5100/

    # Forward real client IP
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "http"

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/dog-api-error.log
    CustomLog ${APACHE_LOG_DIR}/dog-api-access.log combined

    # Redirect to HTTPS once you have a cert (uncomment after certbot)
    # RewriteEngine On
    # RewriteCond %{HTTPS} off
    # RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

# HTTPS block — fill in after running: sudo certbot --apache -d api.yourdomain.com
