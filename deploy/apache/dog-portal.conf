<VirtualHost *:80>
    ServerName yourdomain.com
    ServerAlias www.yourdomain.com

    # Proxy all requests to the .NET Portal on port 5200
    ProxyPreserveHost On
    ProxyPass / http://localhost:5200/
    ProxyPassReverse / http://localhost:5200/

    # Forward real client IP
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "http"

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/dog-portal-error.log
    CustomLog ${APACHE_LOG_DIR}/dog-portal-access.log combined

    # Redirect to HTTPS once you have a cert (uncomment after certbot)
    # RewriteEngine On
    # RewriteCond %{HTTPS} off
    # RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

# HTTPS block — fill in after running: sudo certbot --apache -d yourdomain.com
# <VirtualHost *:443>
#     ServerName yourdomain.com
#     SSLEngine on
#     SSLCertificateFile    /etc/letsencrypt/live/yourdomain.com/fullchain.pem
#     SSLCertificateKeyFile /etc/letsencrypt/live/yourdomain.com/privkey.pem
