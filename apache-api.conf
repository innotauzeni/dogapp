<VirtualHost *:80>
    ServerName api.blackeaglesurveillance.co.zw
    DocumentRoot /var/www/besapi

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5001/
    ProxyPassReverse / http://127.0.0.1:5001/

    ErrorLog ${APACHE_LOG_DIR}/api-error.log
    CustomLog ${APACHE_LOG_DIR}/api-access.log common

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =api.blackeaglesurveillance.co.zw
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName api.blackeaglesurveillance.co.zw
    DocumentRoot /var/www/besapi

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5001/
    ProxyPassReverse / http://127.0.0.1:5001/

    ErrorLog ${APACHE_LOG_DIR}/api-error.log
    CustomLog ${APACHE_LOG_DIR}/api-access.log common

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/api.blackeaglesurveillance.co.zw/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.blackeaglesurveillance.co.zw/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
