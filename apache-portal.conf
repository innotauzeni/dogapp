<VirtualHost *:80>
    ServerName portal.blackeaglesurveillance.co.zw
    DocumentRoot /var/www/besportal

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5002/
    ProxyPassReverse / http://127.0.0.1:5002/

    ErrorLog ${APACHE_LOG_DIR}/portal-error.log
    CustomLog ${APACHE_LOG_DIR}/portal-access.log common

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =portal.blackeaglesurveillance.co.zw
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName portal.blackeaglesurveillance.co.zw
    DocumentRoot /var/www/besportal

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5002/
    ProxyPassReverse / http://127.0.0.1:5002/

    ErrorLog ${APACHE_LOG_DIR}/portal-error.log
    CustomLog ${APACHE_LOG_DIR}/portal-access.log common

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/portal.blackeaglesurveillance.co.zw/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/portal.blackeaglesurveillance.co.zw/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
